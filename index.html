<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>差枚ビューア</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #121212; color: #e8e8e8;
         font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
  header { padding: 14px 16px 8px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #9a9a9a; }
  section { padding: 8px 16px; }
  .card { background: #1e1e1e; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .hero-num { font-size: 34px; font-weight: 700; line-height: 1.1; }
  .hero-num .unit { font-size: 16px; font-weight: 400; }
  .pos { color: #ff7a7a; } .neg { color: #7fb8ff; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip, .seg { border: 1px solid #444; background: #262626; color: #e8e8e8;
                border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .chip.on, .seg.on { background: #ffd75e; color: #222; border-color: #ffd75e; font-weight: 700; }
  .seg { border-radius: 8px; }
  label { font-size: 12px; color: #9a9a9a; display: block; margin: 10px 0 4px; }
  input[type="date"], input[type="text"], input[type="password"] {
    width: 100%; background: #262626; border: 1px solid #444; color: #e8e8e8;
    border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  button.primary { width: 100%; margin-top: 10px; padding: 10px; font-size: 14px;
    border: none; border-radius: 8px; background: #ffd75e; color: #222; font-weight: 700; cursor: pointer; }
  button.ghost { background: none; border: 1px solid #555; color: #ccc; border-radius: 8px;
    padding: 6px 10px; font-size: 12px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; color: #9a9a9a; padding: 6px 4px;
       border-bottom: 1px solid #333; }
  td { padding: 8px 4px; border-bottom: 1px solid #2a2a2a; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.tap { cursor: pointer; }
  tr.tap:active { background: #2a2a2a; }
  .rank1 td { font-weight: 700; }
  .muted { color: #9a9a9a; font-size: 12px; }
  .detail-head { display: flex; justify-content: space-between; align-items: center; }
  .machine-card { background: #1e1e1e; border-radius: 12px; padding: 14px; margin-bottom: 12px;
    cursor: pointer; border: 1px solid #2a2a2a; }
  .machine-card:active { background: #2a2a2a; }
  .mc-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .mc-head strong { font-size: 16px; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px;
    border-radius: 999px; background: #0c3a1e; color: #7fe0a8; vertical-align: 1px; }
  .tabrow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  footer { padding: 4px 16px 24px; font-size: 11px; color: #777; }
</style>
</head>
<body>

<!-- 画面1: トークン入力のみ（保存済みなら自動でスキップして一覧へ） -->
<section id="screen-token">
  <div class="card" style="margin-top:14px">
    <input type="password" id="tokenInput" placeholder="github_pat_…" autocomplete="off">
    <button class="primary" id="loadBtn">読み込む</button>
    <p class="muted" id="tokenStatus"></p>
  </div>
</section>

<!-- 画面2: 機種一覧 -->
<section id="screen-list" style="display:none">
  <header style="padding:14px 0 8px">
    <h1>機種一覧</h1>
    <div class="sub" id="listInfo"></div>
  </header>
  <div class="card" id="crossBanner"></div>
  <div id="machineList"></div>
  <button class="ghost" id="changeTokenBtn">トークンを変更する</button>
</section>

<!-- 画面3: 機種ページ -->
<section id="screen-machine" style="display:none">
  <header style="padding:14px 0 8px">
    <h1 id="machineTitle">機種</h1>
    <div class="sub">タブで機種を切り替えられます</div>
  </header>
  <div class="tabrow" id="machineTabs"></div>

  <div class="card">
    <div class="muted">期間No.1</div>
    <div id="hero" class="hero-num">—</div>
    <div id="heroSub" class="muted"></div>
  </div>

  <div class="card">
    <label>期間（基準日 = データの最新日）</label>
    <div class="row" id="periodRow">
      <button class="seg" data-period="today">今日</button>
      <button class="seg" data-period="yesterday">昨日</button>
      <button class="seg" data-period="7d">直近7日</button>
      <button class="seg" data-period="30d">直近30日</button>
      <button class="seg on" data-period="all">全期間</button>
      <button class="seg" data-period="custom">任意</button>
    </div>
    <div id="customRow" style="display:none">
      <label>開始日</label><input type="date" id="fromDate">
      <label>終了日</label><input type="date" id="toDate">
    </div>

    <label>ランキングの見方</label>
    <div class="row">
      <button class="seg on" data-mode="total">期間合計</button>
      <button class="seg" data-mode="single">単日記録</button>
    </div>

    <label>並べ替え・絞り込み</label>
    <div class="row">
      <button class="seg" id="sortBtn">出てる順 ▼</button>
      <button class="chip" id="plusZeroChip">プラス日ゼロのみ</button>
    </div>

    <label>日付の末尾（特日チェック・複数可）</label>
    <div class="row" id="digitRow"></div>
  </div>

  <div class="card">
    <div class="detail-head">
      <strong id="listTitle">期間合計（全台）</strong>
      <span>
        <button class="ghost" id="backBtn" style="display:none">← 一覧に戻る</button>
        <button class="ghost" id="toListBtn">機種一覧へ</button>
      </span>
    </div>
    <div id="list"></div>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
